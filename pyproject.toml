[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plugin-test-harness"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "soundfile",
    "pedalboard",
    "pytest",
    "hypothesis",
    "python-osc",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"